services:
  mongodb:
    image: mongo:7
    container_name: riyazcrm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: riyazcrm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/riyazcrm
      JWT_ACCESS_SECRET: local-access-secret-change-me
      JWT_REFRESH_SECRET: local-refresh-secret-change-me
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    depends_on:
      - mongodb

volumes:
  mongo_data:
